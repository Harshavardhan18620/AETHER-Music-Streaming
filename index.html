<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AETHER // Antigravity Music Streaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Space Grotesk', 'Inter', 'sans-serif'],
          },
          colors: {
            space: '#07070C',
            violetNeon: '#8B5CF6',
            cyanNeon: '#06B6D4',
            magentaNeon: '#EC4899',
          },
        },
      },
    };
  </script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <style>
    html, body {
      background-color: #07070C;
      color: #F8FAFC;
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    ::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(6, 182, 212, 0.55); }

    .glass-panel {
      background: rgba(255, 255, 255, 0.048);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.095);
    }
    .glass-strong {
      background: rgba(12, 12, 22, 0.84);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }

    /* Ambient Drifting Orbs */
    @keyframes orbDrift1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(85px, 55px) scale(1.12); }
      100% { transform: translate(-35px, 105px) scale(0.95); }
    }
    @keyframes orbDrift2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-95px, -55px) scale(1.14); }
      100% { transform: translate(55px, -85px) scale(0.93); }
    }
    @keyframes orbDrift3 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(65px, -75px) scale(1.08); }
      100% { transform: translate(-75px, 55px) scale(1.04); }
    }
    .orb-1 { animation: orbDrift1 22s ease-in-out infinite alternate; }
    .orb-2 { animation: orbDrift2 26s ease-in-out infinite alternate; }
    .orb-3 { animation: orbDrift3 30s ease-in-out infinite alternate; }

    /* Antigravity Floating Oscillation */
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatZeroG {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(0.9deg); }
    }
    .ag-float {
      animation: floatY 5.4s ease-in-out infinite;
    }
    .ag-zero-g .ag-float-card {
      animation: floatZeroG 4.2s ease-in-out infinite;
      cursor: grab;
      box-shadow: 0 0 26px rgba(6, 182, 212, 0.18);
      border-color: rgba(6, 182, 212, 0.35);
    }
    .ag-zero-g .ag-float-card:active {
      cursor: grabbing;
    }
    .ag-dragging {
      animation: none !important;
      z-index: 60 !important;
      box-shadow: 0 22px 60px rgba(139, 92, 246, 0.38), 0 0 28px rgba(6, 182, 212, 0.45) !important;
    }
    .ag-snapping {
      transition: transform 0.65s cubic-bezier(0.22, 1.28, 0.36, 1) !important;
    }

    /* Spinning Vinyl & Equalizer Bars */
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin-vinyl { animation: spinSlow 8s linear infinite; }
    .spin-paused { animation-play-state: paused; }

    @keyframes eqBar { 0% { height: 22%; } 100% { height: 100%; } }
    .eq-1 { animation: eqBar 0.65s ease-in-out infinite alternate; }
    .eq-2 { animation: eqBar 0.5s ease-in-out 0.15s infinite alternate; }
    .eq-3 { animation: eqBar 0.8s ease-in-out 0.3s infinite alternate; }
    .eq-4 { animation: eqBar 0.58s ease-in-out 0.4s infinite alternate; }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(139, 92, 246, 0.45); }
      50% { box-shadow: 0 0 30px rgba(6, 182, 212, 0.7); }
    }
    .logo-pulse { animation: pulseGlow 3s ease-in-out infinite; }

    .vinyl-grooves {
      background: repeating-radial-gradient(
        circle at center,
        #101018 0px,
        #101018 2px,
        #1f1f30 3px,
        #0b0b12 4px
      );
    }

    /* Custom Neon Range Sliders */
    input[type="range"].neon-slider {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.12);
      height: 5px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }
    input[type="range"].neon-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.9), 0 0 5px rgba(6, 182, 212, 0.9);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].neon-slider::-webkit-slider-thumb:hover {
      transform: scale(1.22);
    }

    /* Magnetic 3D Tilt Wrapper */
    .tilt-inner {
      transition: transform 0.22s ease-out, box-shadow 0.25s ease;
      transform-style: preserve-3d;
    }
    .tilt-card:hover .tilt-inner {
      box-shadow: 0 16px 38px rgba(139, 92, 246, 0.22);
    }

    /* Drawer Slide Transition */
    .drawer-closed { transform: translateX(115%); opacity: 0; pointer-events: none; }
    .drawer-open { transform: translateX(0); opacity: 1; pointer-events: auto; }
  </style>
</head>
<body class="bg-[#07070C] text-slate-100 antialiased selection:bg-violet-500/40 selection:text-white">
  <!-- BACKGROUND DRIFTING AMBIENT ORBS -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden z-0">
    <div class="orb-1 absolute -top-32 -left-24 w-[460px] h-[460px] rounded-full bg-violet-600/20 blur-[130px]"></div>
    <div class="orb-2 absolute top-1/3 -right-24 w-[420px] h-[420px] rounded-full bg-cyan-500/18 blur-[130px]"></div>
    <div class="orb-3 absolute -bottom-32 left-1/3 w-[480px] h-[480px] rounded-full bg-pink-600/16 blur-[140px]"></div>
    <div class="absolute inset-0 opacity-[0.035]" style="background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.65) 1px, transparent 0); background-size: 36px 36px;"></div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" class="relative z-10 flex max-w-[1640px] mx-auto px-3 sm:px-5 pt-4 gap-5 pb-36">
    <!-- LEFT FLOATING SIDEBAR (Desktop) -->
    <aside class="hidden lg:flex flex-col w-64 shrink-0 sticky top-4 h-[calc(100vh-116px)] glass-panel rounded-3xl p-5 justify-between overflow-y-auto">
      <div class="space-y-6">
        <!-- App Logo with Pulsing Soundwave Icon -->
        <button id="logoBtn" class="flex items-center gap-3 w-full text-left group">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-violet-500 via-cyan-400 to-pink-500 p-[1.5px] logo-pulse">
            <div class="w-full h-full rounded-[14px] bg-[#0B0B14] flex items-center justify-center gap-[2.5px]">
              <span class="w-[3px] h-3 bg-violet-400 rounded-full eq-1"></span>
              <span class="w-[3px] h-5 bg-cyan-400 rounded-full eq-2"></span>
              <span class="w-[3px] h-4 bg-pink-400 rounded-full eq-3"></span>
              <span class="w-[3px] h-2.5 bg-violet-300 rounded-full eq-4"></span>
            </div>
          </div>
          <div>
            <div class="font-display font-bold text-lg tracking-wider bg-gradient-to-r from-white via-cyan-200 to-violet-300 bg-clip-text text-transparent">AETHER</div>
            <div class="text-[10px] uppercase tracking-[0.22em] text-cyan-400/80 font-medium">Zero-G Audio</div>
          </div>
        </button>

        <!-- Main Links -->
        <nav id="desktopNav" class="space-y-1.5"></nav>

        <!-- Your Playlists -->
        <div class="pt-3 border-t border-white/10 space-y-3">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-semibold uppercase tracking-[0.16em] text-slate-400">Your Playlists</span>
            <button id="sidebarNewPlMini" class="text-xs font-medium text-cyan-300 hover:text-cyan-200 flex items-center gap-1 px-2 py-1 rounded-lg bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-400/25 transition">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> New
            </button>
          </div>
          <div id="sidebarMoodPills" class="flex flex-wrap gap-1.5"></div>
          <div id="sidebarPlaylistList" class="space-y-1.5 max-h-44 overflow-y-auto pr-1"></div>
          <button id="sidebarCreatePlBtn" class="w-full py-2.5 rounded-2xl border border-dashed border-violet-400/35 bg-violet-500/10 hover:bg-violet-500/20 text-xs font-semibold text-violet-200 flex items-center justify-center gap-1.5 transition">
            <i data-lucide="plus-circle" class="w-4 h-4"></i> + Create Playlist
          </button>
        </div>
      </div>

      <!-- Synth Engine Status -->
      <div class="mt-4 p-3 rounded-2xl bg-white/[0.035] border border-white/10 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span id="synthStatusDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
          <span id="synthStatusLabel" class="text-[11px] font-medium text-slate-300">Synth Standby</span>
        </div>
        <span id="synthBpmBadge" class="text-[10px] font-mono text-violet-300">112 BPM</span>
      </div>
    </aside>

    <!-- MOBILE SIDEBAR DRAWER -->
    <div id="mobileDrawer" class="fixed inset-0 z-50 lg:hidden hidden">
      <div id="mobileDrawerBackdrop" class="fixed inset-0 bg-black/75 backdrop-blur-sm"></div>
      <aside class="relative z-10 w-72 max-w-[82vw] h-full glass-strong p-5 flex flex-col justify-between overflow-y-auto">
        <div class="space-y-5">
          <div class="flex items-center justify-between">
            <span class="font-display font-bold text-lg bg-gradient-to-r from-white to-cyan-300 bg-clip-text text-transparent">AETHER ZERO-G</span>
            <button id="mobileDrawerClose" class="p-2 rounded-xl bg-white/5 hover:bg-white/10"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <nav id="mobileNav" class="space-y-1.5"></nav>
          <button id="mobileCreatePlBtn" class="w-full py-2.5 rounded-2xl bg-violet-500/20 border border-violet-400/40 text-xs font-semibold text-violet-100">+ Create Playlist</button>
        </div>
      </aside>
    </div>

    <!-- MAIN CONTENT COLUMN -->
    <main class="flex-1 min-w-0 space-y-6">
      <!-- TOP FLOATING HEADER -->
      <header class="sticky top-4 z-30 glass-strong rounded-3xl px-4 py-3 flex flex-wrap items-center justify-between gap-3 shadow-[0_10px_34px_rgba(0,0,0,0.5)]">
        <div class="flex items-center gap-3 flex-1 min-w-[200px]">
          <button id="mobileMenuBtn" class="lg:hidden p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-200" aria-label="Menu">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <!-- Global Search Bar -->
          <div class="relative flex-1 max-w-md">
            <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
            <input id="globalSearch" type="text" placeholder="Search tracks, artists, albums..." class="w-full pl-10 pr-16 py-2 rounded-2xl bg-white/[0.06] border border-white/10 focus:border-cyan-400/60 focus:bg-white/[0.09] text-sm text-white placeholder-slate-400 outline-none transition" />
            <button id="clearSearchBtn" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
            <kbd id="searchShortcutBadge" class="hidden sm:inline-flex items-center px-2 py-0.5 rounded-lg bg-white/10 border border-white/10 text-[10px] font-mono text-slate-300 absolute right-2.5 top-1/2 -translate-y-1/2">⌘K</kbd>
          </div>
        </div>

        <!-- Right Controls -->
        <div class="flex items-center gap-2.5 flex-wrap">
          <!-- Antigravity Mode Toggle -->
          <button id="antigravityToggleBtn" class="flex items-center gap-2 px-3.5 py-2 rounded-2xl text-xs font-semibold border bg-white/5 border-white/10 text-slate-300 hover:bg-white/10 transition-all">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-violet-400"></i>
            <span>Antigravity</span>
            <span id="agSwitchTrack" class="w-8 h-4 rounded-full p-0.5 flex items-center bg-white/15 justify-start transition-colors">
              <span class="w-3 h-3 rounded-full bg-white shadow"></span>
            </span>
          </button>

          <!-- Reset Gravity Button -->
          <button id="resetGravityBtn" class="hidden flex items-center gap-1.5 px-3 py-2 rounded-2xl text-xs font-semibold bg-pink-500/20 hover:bg-pink-500/30 border border-pink-400/50 text-pink-200 shadow-[0_0_16px_rgba(236,72,153,0.3)] transition">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
            Reset Gravity
          </button>

          <!-- Listening Streak Badge -->
          <div class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-2xl bg-violet-500/15 border border-violet-400/30 text-xs font-semibold text-violet-200">
            <i data-lucide="flame" class="w-3.5 h-3.5 text-pink-400"></i>
            <span>14d Streak</span>
          </div>

          <!-- Profile Avatar + Notifications -->
          <div class="relative">
            <button id="profileBtn" class="relative flex items-center gap-2 p-1 pr-2.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition">

    // =========================================================================
    // 4. WEB AUDIO API SYNTHESIZER + REAL-TIME ANALYSER
    // =========================================================================
    class AntigravitySynth {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.analyser = null;
        this.lowShelf = null;
        this.lowPass = null;
        this.delay = null;
        this.delayFb = null;
        this.delayWet = null;
        this.timer = null;
        this.step = 0;
        this.playing = false;
      }

      init() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.analyser = this.ctx.createAnalyser();
        this.analyser.fftSize = 128;
        this.analyser.smoothingTimeConstant = 0.82;

        this.lowShelf = this.ctx.createBiquadFilter();
        this.lowShelf.type = 'lowshelf';
        this.lowShelf.frequency.value = 140;

        this.lowPass = this.ctx.createBiquadFilter();
        this.lowPass.type = 'lowpass';
        this.lowPass.Q.value = 2.2;

        this.delay = this.ctx.createDelay(1.2);
        this.delayFb = this.ctx.createGain();
        this.delayWet = this.ctx.createGain();

        this.lowShelf.connect(this.lowPass);
        this.lowPass.connect(this.master);
        this.lowPass.connect(this.delay);
        this.delay.connect(this.delayFb);
        this.delayFb.connect(this.delay);
        this.delay.connect(this.delayWet);
        this.delayWet.connect(this.master);

        this.master.connect(this.analyser);
        this.analyser.connect(this.ctx.destination);
        this.updateParams();
        this.updateVolume();
      }

      updateParams() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const { energy, bass, tempo, echo } = state.mixer;
        this.lowShelf.gain.setTargetAtTime((bass / 100) * 20 - 6, now, 0.08);
        const cutoff = 450 + Math.pow(energy / 100, 1.6) * 6350;
        this.lowPass.frequency.setTargetAtTime(cutoff, now, 0.08);
        const beat = 60 / Math.max(60, tempo);
        this.delay.delayTime.setTargetAtTime(Math.min(0.95, beat * 0.75), now, 0.1);
        this.delayFb.gain.setTargetAtTime((echo / 100) * 0.52, now, 0.08);
        this.delayWet.gain.setTargetAtTime((echo / 100) * 0.55, now, 0.08);
      }

      updateVolume() {
        if (!this.ctx || !this.master) return;
        this.master.gain.setTargetAtTime(state.isMuted ? 0 : state.volume * 0.45, this.ctx.currentTime, 0.05);
      }

      playPad(freqs, dur) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        freqs.forEach((f, idx) => {
          const o1 = this.ctx.createOscillator();
          const o2 = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o1.type = idx === 0 ? 'triangle' : 'sawtooth';
          o2.type = 'sine';
          o1.frequency.setValueAtTime(f, now);
          o2.frequency.setValueAtTime(f * 1.004, now);
          const pk = idx === 0 ? 0.12 : 0.045;
          g.gain.setValueAtTime(0.0001, now);
          g.gain.linearRampToValueAtTime(pk, now + 0.22);
          g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
          o1.connect(g);
          o2.connect(g);
          g.connect(this.lowShelf);
          o1.start(now); o2.start(now);
          o1.stop(now + dur + 0.04); o2.stop(now + dur + 0.04);
        });
      }

      playKick(strength) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(135, now);
        o.frequency.exponentialRampToValueAtTime(38, now + 0.14);
        g.gain.setValueAtTime(0.24 + (state.mixer.bass / 100) * 0.28 * strength, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        o.connect(g);
        g.connect(this.lowShelf);
        o.start(now);
        o.stop(now + 0.26);
      }

      playArp(freq) {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = state.mixer.energy > 65 ? 'triangle' : 'sine';
        o.frequency.setValueAtTime(freq, now);
        g.gain.setValueAtTime(0.0001, now);
        g.gain.linearRampToValueAtTime(0.04 + (state.mixer.energy / 100) * 0.06, now + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0008, now + 0.34);
        o.connect(g);
        g.connect(this.lowShelf);
        o.start(now);
        o.stop(now + 0.36);
      }

      playHat() {
        if (!this.ctx || state.mixer.energy < 35) return;
        const now = this.ctx.currentTime;
        const len = Math.floor(this.ctx.sampleRate * 0.04);
        const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 7200;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.02 + (state.mixer.energy / 100) * 0.05, now);
        g.gain.exponentialRampToValueAtTime(0.0005, now + 0.04);
        src.connect(hp);
        hp.connect(g);
        g.connect(this.master);
        src.start(now);
      }

      tick() {
        if (!this.playing || !this.ctx) return;
        const track = getCurrentTrack();
        const stepDur = (60 / Math.max(60, state.mixer.tempo)) / 2;
        if (this.step % 8 === 0) {
          const ci = Math.floor(this.step / 8) % track.chords.length;
          this.playPad(track.chords[ci], stepDur * 8.2);
        }
        if (this.step % 4 === 0) this.playKick(1.0);
        else if (this.step % 8 === 6 && state.mixer.energy > 65) this.playKick(0.6);
        if (this.step % 2 === 1) this.playHat();
        if (this.step % 2 === 0 || state.mixer.energy > 55) {
          this.playArp(track.arpNotes[this.step % track.arpNotes.length]);
        }
        this.step = (this.step + 1) % 32;
      }

      restartLoop() {
        if (this.timer) clearInterval(this.timer);
        const ms = ((60 / Math.max(60, state.mixer.tempo)) / 2) * 1000;
        this.timer = setInterval(() => this.tick(), ms);
      }

      start() {
        this.init();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        this.playing = true;
        this.tick();
        this.restartLoop();
      }

      stop() {
        this.playing = false;
        if (this.timer) { clearInterval(this.timer); this.timer = null; }
      }

      getBars(count) {
        const out = new Array(count).fill(0.07);
        if (!this.playing || !this.analyser) return out;
        const bins = new Uint8Array(this.analyser.frequencyBinCount);
        this.analyser.getByteFrequencyData(bins);
        const step = Math.max(1, Math.floor(bins.length / count));
        for (let i = 0; i < count; i++) {
          out[i] = Math.max(0.08, Math.min(1, (bins[Math.min(bins.length - 1, i * step)] || 0) / 235));
        }
        return out;
      }
    }

    const synth = new AntigravitySynth();

    // =========================================================================
    // 5. HELPERS
    // =========================================================================
    function getCurrentTrack() {
      return TRACKS.find((t) => t.id === state.currentTrackId) || TRACKS[0];
    }
    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      return `${Math.floor(s / 60)}:${s % 60 < 10 ? '0' : ''}${s % 60}`;
    }
    function esc(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toastEl');
      el.textContent = msg;
      el.classList.remove('opacity-0', '-translate-y-3');
      el.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.add('opacity-0', '-translate-y-3');
        el.classList.remove('opacity-100', 'translate-y-0');
      }, 2600);
    }

    function getGravityMatches() {
      return [...TRACKS]
        .map((t) => {
          const diff =
            Math.abs(t.profile.energy - state.mixer.energy) * 1.1 +
            Math.abs(t.profile.bass - state.mixer.bass) * 1.0 +
            Math.abs(t.profile.tempo - state.mixer.tempo) * 1.2 +
            Math.abs(t.profile.echo - state.mixer.echo) * 0.9;
          return { ...t, matchPct: Math.max(42, Math.min(99, Math.round(100 - diff / 3.4))) };
        })
        .sort((a, b) => b.matchPct - a.matchPct);
    }

    // =========================================================================
    // 6. PLAYBACK CONTROLS
    // =========================================================================
    function playTrack(trackId, customQueue = null) {
      const track = TRACKS.find((t) => t.id === trackId);
      if (!track) return;
      state.currentTrackId = track.id;
      state.currentTime = 0;
      state.isPlaying = true;
      state.mixer = { ...track.profile };
      synth.step = 0;
      synth.updateParams();
      synth.start();

      if (customQueue) {
        state.queueIds = customQueue.filter((id) => id !== track.id);
      }
      state.recentHistory = [
        { trackId: track.id, timeAgo: 'Just now' },
        ...state.recentHistory.filter((r) => r.trackId !== track.id),
      ].slice(0, 6);

      renderAll();
    }

    function togglePlayPause() {
      if (state.isPlaying) {
        synth.stop();
        state.isPlaying = false;
      } else {
        synth.updateParams();
        synth.start();
        state.isPlaying = true;
      }
      updatePlayerUI();
      renderDashboard();
    }

    function nextTrack() {
      if (state.queueIds.length > 0) {
        const idx = state.shuffle ? Math.floor(Math.random() * state.queueIds.length) : 0;
        const nextId = state.queueIds[idx];
        state.queueIds = state.queueIds.filter((_, i) => i !== idx);
        if (state.repeatMode === 'all') state.queueIds.push(state.currentTrackId);
        playTrack(nextId);
      } else {
        const cur = TRACKS.findIndex((t) => t.id === state.currentTrackId);
        playTrack(TRACKS[(cur + 1) % TRACKS.length].id);
      }
    }

    function prevTrack() {
      if (state.currentTime > 4) {
        state.currentTime = 0;
        updatePlayerUI();
        return;
      }
      const cur = TRACKS.findIndex((t) => t.id === state.currentTrackId);
      playTrack(TRACKS[(cur - 1 + TRACKS.length) % TRACKS.length].id);
    }

    // Playback progress ticker
    setInterval(() => {
      if (!state.isPlaying) return;
      const track = getCurrentTrack();
      state.currentTime += 1;
      if (state.currentTime >= track.duration) {
        if (state.repeatMode === 'one') state.currentTime = 0;
        else nextTrack();
      }
      updateProgressBarOnly();
      if (state.drawerMode === 'lyrics') renderDrawer();
    }, 1000);

    // =========================================================================
    // 7. REAL-TIME AUDIO VISUALIZER LOOP
    // =========================================================================
    const VIS_BAR_COUNT = 44;
    function initVisualizer() {
      const wrap = document.getElementById('visualizerBarWrap');
      wrap.innerHTML = '';
      for (let i = 0; i < VIS_BAR_COUNT; i++) {
        const r = i / VIS_BAR_COUNT;
        const grad = r < 0.33 ? 'from-violet-600/80 to-violet-400/90' : r < 0.66 ? 'from-cyan-500/80 to-cyan-300/90' : 'from-pink-600/80 to-pink-400/90';
        const div = document.createElement('div');
        div.className = `vis-bar flex-1 max-w-[10px] rounded-t-full bg-gradient-to-t ${grad} transition-all duration-75`;
        div.style.height = '12%';
        wrap.appendChild(div);
      }
      let phase = 0;
      function frame() {
        phase += 0.08;
        wrap.style.display = state.showVisualizer ? 'flex' : 'none';
        if (state.showVisualizer) {
          const bars = wrap.children;
          const live = synth.getBars(VIS_BAR_COUNT);
          const hasSignal = state.isPlaying && live.some((v) => v > 0.11);
          for (let i = 0; i < bars.length; i++) {
            let h = 0.09;
            if (state.isPlaying) {
              h = hasSignal
                ? live[i]
                : Math.max(0.12, Math.min(0.92, ((Math.sin(phase * 1.4 + i * 0.36) + 1) * 0.32 + (Math.cos(phase * 0.9 - i * 0.22) + 1) * 0.2) * (0.45 + state.mixer.energy / 150)));
            } else {
              h = 0.08 + (Math.sin(phase * 0.4 + i * 0.3) + 1) * 0.04;
            }
            bars[i].style.height = `${Math.round(h * 100)}%`;
          }
        }
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // =========================================================================
    // 8. ZERO-GRAVITY DRAG WITH INERTIA + MAGNETIC 3D TILT
    // =========================================================================
    function attachPhysicsToCards() {
      // Magnetic 3D tilt
      document.querySelectorAll('.tilt-card').forEach((card) => {
        const inner = card.querySelector('.tilt-inner');
        if (!inner) return;
        card.addEventListener('mousemove', (e) => {
          if (card.classList.contains('ag-dragging')) return;
          const rect = card.getBoundingClientRect();
          const px = (e.clientX - rect.left) / rect.width - 0.5;
          const py = (e.clientY - rect.top) / rect.height - 0.5;
          inner.style.transform = `perspective(900px) rotateX(${(-py * 11).toFixed(2)}deg) rotateY(${(px * 11).toFixed(2)}deg) scale(1.03)`;
        });
        card.addEventListener('mouseleave', () => {
          inner.style.transform = 'perspective(900px) rotateX(0deg) rotateY(0deg) scale(1)';
        });
      });

      // Zero-Gravity Drag with Velocity Inertia
      document.querySelectorAll('[data-ag-card]').forEach((el) => {
        const id = el.dataset.agCard;
        const saved = state.cardOffsets[id] || { x: 0, y: 0, r: 0 };
        if (state.antigravityMode && (saved.x !== 0 || saved.y !== 0)) {
          el.style.transform = `translate3d(${saved.x}px, ${saved.y}px, 0) rotate(${saved.r}deg)`;
        }

        el.addEventListener('pointerdown', (e) => {
          if (!state.antigravityMode) return;
          if (e.target.closest('button')) return;
          e.preventDefault();
          const cur = state.cardOffsets[id] || { x: 0, y: 0, r: 0 };
          let startX = e.clientX - cur.x;
          let startY = e.clientY - cur.y;
          let lastX = e.clientX;
          let lastY = e.clientY;
          let vx = 0, vy = 0;
          let moved = false;
          el.classList.remove('ag-snapping');
          el.classList.add('ag-dragging');
          el.setPointerCapture?.(e.pointerId);

          const onMove = (ev) => {
            vx = ev.clientX - lastX;
            vy = ev.clientY - lastY;
            lastX = ev.clientX;
            lastY = ev.clientY;
            const nx = ev.clientX - startX;
            const ny = ev.clientY - startY;
            if (Math.abs(nx - cur.x) > 4 || Math.abs(ny - cur.y) > 4) moved = true;
            const nr = Math.max(-10, Math.min(10, vx * 0.45));
            state.cardOffsets[id] = { x: nx, y: ny, r: nr };
            el.style.transform = `translate3d(${nx}px, ${ny}px, 0) rotate(${nr}deg)`;
          };

          const onUp = () => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
            el.classList.remove('ag-dragging');
            if (moved) {
              el.dataset.justDragged = '1';
              setTimeout(() => { el.dataset.justDragged = ''; }, 180);
              // Inertia glide loop
              const glide = () => {
                vx *= 0.91;
                vy *= 0.91;
                const pos = state.cardOffsets[id] || { x: 0, y: 0, r: 0 };
                pos.x += vx;
                pos.y += vy;
                pos.r *= 0.9;
                state.cardOffsets[id] = pos;
                el.style.transform = `translate3d(${pos.x}px, ${pos.y}px, 0) rotate(${pos.r}deg)`;
                if (Math.abs(vx) > 0.35 || Math.abs(vy) > 0.35) requestAnimationFrame(glide);
              };
              requestAnimationFrame(glide);
            }
          };

          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });
      });
    }

                      <div class="w-7 flex items-center justify-center shrink-0">
                        ${isCur && state.isPlaying
                          ? '<div class="flex items-end gap-[2px] h-4"><span class="w-[3px] bg-cyan-400 rounded-full eq-1"></span><span class="w-[3px] bg-violet-400 rounded-full eq-2"></span><span class="w-[3px] bg-pink-400 rounded-full eq-3"></span></div>'
                          : `<span class="text-xs font-mono ${isCur ? 'text-cyan-300 font-bold' : 'text-slate-500 group-hover:text-white'}">${String(idx + 1).padStart(2, '0')}</span>`
                        }
                      </div>
                      <img src="${t.cover}" alt="${esc(t.title)}" class="w-11 h-11 rounded-xl object-cover border border-white/10 shrink-0" />
                      <div class="min-w-0 flex-1">
                        <div class="text-sm font-semibold truncate ${isCur ? 'text-cyan-300' : 'text-white'}">${esc(t.title)}</div>
                        <div class="text-xs text-slate-400 truncate">${esc(t.artist)} • <span class="text-slate-500">${esc(t.album)}</span></div>
                      </div>
                      <span class="hidden sm:inline-block text-xs font-mono text-slate-400 mr-2">${formatTime(t.duration)}</span>
                      <button data-like-track="${t.id}" class="p-2 rounded-xl transition ${liked ? 'text-pink-400 hover:bg-pink-500/15' : 'text-slate-500 hover:text-white hover:bg-white/10'}">
                        <i data-lucide="heart" class="w-4 h-4 ${liked ? 'fill-current' : ''}"></i>
                      </button>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Right Column (40%): Recently Played + Quick Mood Gravity Mixer -->
            <div class="xl:col-span-2 space-y-5">
              <div class="glass-panel rounded-3xl p-5 space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="font-display text-lg font-bold text-white">Recently Played</h2>
                  <i data-lucide="clock" class="w-4 h-4 text-cyan-400"></i>
                </div>
                <div class="space-y-3">
                  ${state.recentHistory.map((item) => {
                    const t = TRACKS.find((x) => x.id === item.trackId);
                    if (!t) return '';
                    return `
                      <div class="flex items-center gap-3 p-2 rounded-2xl hover:bg-white/5 transition group">
                        <img src="${t.cover}" alt="${esc(t.title)}" class="w-10 h-10 rounded-xl object-cover border border-white/10 shrink-0" />
                        <div class="min-w-0 flex-1">
                          <div class="text-xs font-semibold text-white truncate">${esc(t.title)}</div>
                          <div class="text-[11px] text-slate-400 truncate">${esc(t.artist)} • <span class="text-cyan-300/80">${item.timeAgo}</span></div>
                        </div>
                        <button data-play-track="${t.id}" class="p-2 rounded-xl bg-white/5 hover:bg-violet-500/30 text-slate-300 hover:text-white transition" title="Quick Replay">
                          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- Compact Mood Gravity Mixer Widget -->
              <div class="glass-panel rounded-3xl p-5 space-y-4 border-violet-400/20">
                <div class="flex items-center justify-between">
                  <div>
                    <h2 class="font-display text-base font-bold text-white flex items-center gap-2">
                      <i data-lucide="sliders-horizontal" class="w-4 h-4 text-violet-400"></i> Mood Gravity Mixer
                    </h2>
                    <p class="text-[11px] text-slate-400">Live Web Audio Synth & Track Match</p>
                  </div>
                  <button id="expandMixerBtn" class="text-[11px] font-semibold text-cyan-300 hover:underline">Expand</button>
                </div>
                <div class="space-y-3">
                  ${[
                    { k: 'energy', label: 'Energy', min: 10, max: 100, unit: '%' },
                    { k: 'bass', label: 'Bass', min: 10, max: 100, unit: '%' },
                    { k: 'tempo', label: 'Tempo', min: 65, max: 145, unit: ' BPM' },
                    { k: 'echo', label: 'Spatial Echo', min: 0, max: 100, unit: '%' },
                  ].map((s) => `
                    <div class="space-y-1">
                      <div class="flex justify-between text-[11px]">
                        <span class="text-slate-300 font-medium">${s.label}</span>
                        <span data-mixer-val="${s.k}" class="font-mono text-cyan-300">${state.mixer[s.k]}${s.unit}</span>
                      </div>
                      <input type="range" data-mixer-slider="${s.k}" data-unit="${s.unit}" min="${s.min}" max="${s.max}" value="${state.mixer[s.k]}" class="w-full neon-slider" />
                    </div>
                  `).join('')}
                </div>
                <div id="topGravityMatchCard" data-play-track="${matches[0].id}" class="p-2.5 rounded-2xl bg-gradient-to-r from-violet-500/20 to-cyan-500/15 border border-cyan-400/30 flex items-center gap-3 cursor-pointer hover:brightness-110 transition">
                  <img src="${matches[0].cover}" alt="" class="w-9 h-9 rounded-lg object-cover" />
                  <div class="min-w-0 flex-1">
                    <div class="text-[10px] uppercase tracking-wider text-cyan-300 font-semibold">Top Gravity Match (${matches[0].matchPct}%)</div>
                    <div class="text-xs font-bold text-white truncate">${esc(matches[0].title)} — ${esc(matches[0].artist)}</div>
                  </div>
                  <i data-lucide="play" class="w-3.5 h-3.5 text-white fill-current shrink-0"></i>
                </div>
              </div>
            </div>
          </section>
        `;
      }

      // 6. TRENDING ALBUMS (3D Tilt + Vinyl Slide-Out + Draggable)
      if (state.activeNav === 'Home' || state.activeNav === 'Discover' || state.activeNav === 'Albums') {
        html += `
          <section class="space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-display text-lg sm:text-xl font-bold text-white">Trending Albums</h2>
              <span class="text-xs text-slate-400">Hover to reveal vinyl • Click to stream</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
              ${filteredAlbums.map((alb, idx) => {
                const albTracks = TRACKS.filter((t) => t.albumId === alb.id);
                return `
                  <div data-ag-card="alb-${alb.id}" data-open-alb="${alb.id}" class="tilt-card ag-float ag-float-card relative glass-panel rounded-3xl p-4 group cursor-pointer" style="animation-delay:${(idx + 1) * 0.3}s">
                    <div class="tilt-inner">
                      ${state.antigravityMode ? '<span class="pointer-events-none absolute top-0 right-0 z-20 px-1.5 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-400/40 text-[9px] font-semibold uppercase tracking-wider text-cyan-200">Drag</span>' : ''}
                      <div class="relative flex items-center mb-4">
                        <div class="absolute right-3 w-32 h-32 sm:w-36 sm:h-36 rounded-full vinyl-grooves border border-white/15 shadow-2xl flex items-center justify-center transition-all duration-500 ease-out group-hover:translate-x-6 group-hover:rotate-90">
                          <div class="w-11 h-11 rounded-full border-2 border-black/80 flex items-center justify-center" style="background:${alb.accent}">
                            <div class="w-2.5 h-2.5 rounded-full bg-[#07070C]"></div>
                          </div>
                        </div>
                        <div class="relative z-10 w-36 h-36 sm:w-40 sm:h-40 rounded-2xl overflow-hidden border border-white/15 shadow-[0_14px_30px_rgba(0,0,0,0.65)]">
                          <img src="${alb.cover}" alt="${esc(alb.title)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                        </div>
                      </div>
                      <div class="flex items-start justify-between gap-2">
                        <div class="min-w-0">
                          <h3 class="font-display font-bold text-base text-white truncate">${esc(alb.title)}</h3>
                          <p class="text-xs text-slate-400 truncate">${esc(alb.artist)}</p>
                        </div>
                        <span class="px-2.5 py-0.5 rounded-full bg-white/10 text-[10px] font-semibold text-violet-200 shrink-0">${alb.year}</span>
                      </div>
                      <div class="mt-2.5 flex items-center justify-between text-[11px] text-slate-400">
                        <span class="px-2 py-0.5 rounded-lg bg-cyan-500/10 border border-cyan-400/20 text-cyan-300">${esc(alb.genre)}</span>
                        <span>${albTracks.length} tracks</span>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        `;
      }

      container.innerHTML = html;

      // Wire Dashboard Event Listeners
      document.getElementById('heroListenBtn')?.addEventListener('click', () => playTrack('trk-1', ['trk-7', 'trk-3', 'trk-4', 'trk-2']));
      document.getElementById('heroSaveBtn')?.addEventListener('click', () => {
        state.heroSaved = !state.heroSaved;
        showToast(state.heroSaved ? 'Saved "Astral Drift" to Library' : 'Removed from Library');
        renderDashboard();
      });
      document.getElementById('mixerAuditionBtn')?.addEventListener('click', togglePlayPause);
      document.getElementById('expandMixerBtn')?.addEventListener('click', () => { state.activeNav = 'Mood Gravity Mixer'; renderAll(); });

      container.querySelectorAll('[data-dash-mood]').forEach((b) => {
        b.addEventListener('click', () => { state.selectedMood = b.dataset.dashMood; renderAll(); });
      });
      container.querySelectorAll('[data-select-artist]').forEach((el) => {
        el.addEventListener('click', () => {
          const id = el.dataset.selectArtist;
          state.selectedArtistId = state.selectedArtistId === id ? null : id;
          renderAll();
        });
      });
      container.querySelectorAll('[data-follow-artist]').forEach((b) => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = b.dataset.followArtist;
          if (state.followedArtistIds.has(id)) state.followedArtistIds.delete(id);
          else state.followedArtistIds.add(id);
          renderDashboard();
        });
      });
      container.querySelectorAll('[data-open-pl]').forEach((el) => {
        el.addEventListener('click', () => {
          if (el.dataset.justDragged) return;
          const pl = state.playlists.find((x) => x.id === el.dataset.openPl);
          if (pl) { playTrack(pl.trackIds[0], pl.trackIds); showToast(`Playing "${pl.name}"`); }
        });
      });
      container.querySelectorAll('[data-open-alb]').forEach((el) => {
        el.addEventListener('click', () => {
          if (el.dataset.justDragged) return;
          const alb = ALBUMS.find((x) => x.id === el.dataset.openAlb);
          const ts = TRACKS.filter((t) => t.albumId === alb.id);
          if (ts.length) { playTrack(ts[0].id, ts.map((t) => t.id)); showToast(`Streaming album "${alb.title}"`); }
        });
      });
      container.querySelectorAll('[data-play-track]').forEach((el) => {
        el.addEventListener('click', () => playTrack(el.dataset.playTrack));
      });
      container.querySelectorAll('[data-like-track]').forEach((b) => {
        b.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = b.dataset.likeTrack;
          if (state.likedIds.has(id)) state.likedIds.delete(id);
          else state.likedIds.add(id);
          renderDashboard();
          updatePlayerUI();
        });
      });
      container.querySelectorAll('[data-mixer-slider]').forEach((sl) => {
        sl.addEventListener('input', (e) => {
          const k = sl.dataset.mixerSlider;
          const unit = sl.dataset.unit || '';
          const val = Number(e.target.value);
          const tempoChanged = k === 'tempo' && val !== state.mixer.tempo;
          state.mixer[k] = val;
          synth.updateParams();
          if (state.isPlaying && tempoChanged) synth.restartLoop();
          document.querySelectorAll(`[data-mixer-val="${k}"]`).forEach((v) => { v.textContent = `${val}${unit}`; });
          document.getElementById('synthBpmBadge').textContent = `${state.mixer.tempo} BPM`;
          // Update dynamic recommendations without losing slider focus
          const updated = getGravityMatches();
          const topCard = document.getElementById('topGravityMatchCard');
          if (topCard && updated[0]) {
            topCard.dataset.playTrack = updated[0].id;
            topCard.querySelector('img').src = updated[0].cover;
            topCard.querySelector('.text-cyan-300').textContent = `Top Gravity Match (${updated[0].matchPct}%)`;
            topCard.querySelector('.text-white').textContent = `${updated[0].title} — ${updated[0].artist}`;
          }
          const grid = document.getElementById('mixerMatchGrid');
          if (grid) {
            grid.innerHTML = updated.slice(0, 6).map((t) => `
              <div data-play-track="${t.id}" class="flex items-center gap-3.5 p-3 rounded-2xl cursor-pointer transition border ${
                state.currentTrackId === t.id ? 'bg-violet-500/20 border-violet-400/50' : 'bg-white/[0.03] border-white/5 hover:bg-white/[0.07]'
              }">
                <img src="${t.cover}" alt="${esc(t.title)}" class="w-12 h-12 rounded-xl object-cover" />
                <div class="min-w-0 flex-1">
                  <div class="text-sm font-semibold text-white truncate">${esc(t.title)}</div>
                  <div class="text-xs text-slate-400 truncate">${esc(t.artist)} • ${t.profile.tempo} BPM</div>
                </div>
                <span class="px-2.5 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/30 text-xs font-mono font-semibold text-cyan-300">${t.matchPct}% match</span>
              </div>
            `).join('');
            grid.querySelectorAll('[data-play-track]').forEach((el) => el.addEventListener('click', () => playTrack(el.dataset.playTrack)));
          }
        });
      });

      attachPhysicsToCards();
      if (window.lucide) window.lucide.createIcons();
    }

    function renderDrawer() {
      const drawer = document.getElementById('rightDrawer');
      const content = document.getElementById('drawerContent');
      const tabL = document.getElementById('tabLyricsBtn');
      const tabQ = document.getElementById('tabQueueBtn');

      if (!state.drawerMode) {
        drawer.classList.add('drawer-closed');
        drawer.classList.remove('drawer-open');
        return;
      }
      drawer.classList.remove('drawer-closed');
      drawer.classList.add('drawer-open');

      tabL.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold transition ${
        state.drawerMode === 'lyrics' ? 'bg-violet-500/35 text-white shadow' : 'text-slate-400 hover:text-white'
      }`;
      tabQ.textContent = `Up Next (${state.queueIds.length})`;
      tabQ.className = `px-3.5 py-1.5 rounded-xl text-xs font-semibold transition ${
        state.drawerMode === 'queue' ? 'bg-cyan-500/35 text-white shadow' : 'text-slate-400 hover:text-white'
      }`;

      const track = getCurrentTrack();
      if (state.drawerMode === 'lyrics') {
        const lines = track.lyrics || [];
        let activeIdx = 0;
        for (let i = 0; i < lines.length; i++) if (state.currentTime >= lines[i].t) activeIdx = i;
        content.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center gap-3 p-3 rounded-2xl bg-white/5 border border-white/10">
              <img src="${track.cover}" alt="" class="w-11 h-11 rounded-xl object-cover" />
              <div class="min-w-0">
                <div class="text-sm font-bold text-white truncate">${esc(track.title)}</div>
                <div class="text-xs text-cyan-300 truncate">${esc(track.artist)}</div>
              </div>
            </div>
            <div class="space-y-3.5 px-1">
              ${lines.map((l, idx) => `
                <p data-seek-t="${l.t}" class="cursor-pointer transition-all duration-300 leading-relaxed ${
                  idx === activeIdx
                    ? 'text-lg font-bold text-white drop-shadow-[0_0_12px_rgba(6,182,212,0.65)]'
                    : idx < activeIdx ? 'text-sm text-slate-500 hover:text-slate-300' : 'text-sm text-slate-400 hover:text-slate-200'
                }">${esc(l.text)}</p>
              `).join('')}
            </div>
          </div>
        `;
        content.querySelectorAll('[data-seek-t]').forEach((p) => {
          p.addEventListener('click', () => {
            state.currentTime = Number(p.dataset.seekT);
            updateProgressBarOnly();
            renderDrawer();
          });
        });
      } else {
        content.innerHTML = `
          <div class="space-y-2.5">
            <div class="text-[11px] uppercase tracking-wider text-slate-400 font-semibold px-1">Drag tracks to reorder queue</div>
            ${state.queueIds.map((id, idx) => {
              const t = TRACKS.find((x) => x.id === id);
              if (!t) return '';
              return `
                <div draggable="true" data-q-idx="${idx}" class="flex items-center gap-2.5 p-2.5 rounded-2xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/5 cursor-grab active:cursor-grabbing transition">
                  <i data-lucide="grip-vertical" class="w-3.5 h-3.5 text-slate-500 shrink-0"></i>
                  <img src="${t.cover}" data-q-play="${t.id}" alt="" class="w-10 h-10 rounded-xl object-cover cursor-pointer shrink-0" />
                  <div data-q-play="${t.id}" class="min-w-0 flex-1 cursor-pointer">
                    <div class="text-xs font-semibold text-white truncate">${esc(t.title)}</div>
                    <div class="text-[11px] text-slate-400 truncate">${esc(t.artist)}</div>
                  </div>
                  <button data-q-del="${idx}" class="p-1.5 rounded-lg text-slate-500 hover:text-pink-400 hover:bg-white/5" title="Remove">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        `;
        content.querySelectorAll('[data-q-idx]').forEach((row) => {
          const idx = Number(row.dataset.qIdx);
          row.addEventListener('dragstart', () => { state.draggedQueueIdx = idx; });
          row.addEventListener('dragover', (e) => e.preventDefault());
          row.addEventListener('drop', () => {
            if (state.draggedQueueIdx === null || state.draggedQueueIdx === idx) return;
            const [moved] = state.queueIds.splice(state.draggedQueueIdx, 1);
            state.queueIds.splice(idx, 0, moved);
            state.draggedQueueIdx = null;
            renderDrawer();
          });
        });
        content.querySelectorAll('[data-q-play]').forEach((el) => el.addEventListener('click', () => playTrack(el.dataset.qPlay)));
        content.querySelectorAll('[data-q-del]').forEach((b) => {
          b.addEventListener('click', () => {
            state.queueIds.splice(Number(b.dataset.qDel), 1);
            renderDrawer();
          });
        });
      }
      if (window.lucide) window.lucide.createIcons();
    }

    function updateProgressBarOnly() {
      const track = getCurrentTrack();
      const seek = document.getElementById('seekSlider');
      seek.max = track.duration;
      seek.value = state.currentTime;
      const pct = track.duration > 0 ? (state.currentTime / track.duration) * 100 : 0;
      seek.style.background = `linear-gradient(to right, #06B6D4 ${pct}%, rgba(255,255,255,0.12) ${pct}%)`;
      document.getElementById('timeCurrent').textContent = formatTime(state.currentTime);
      document.getElementById('timeTotal').textContent = formatTime(track.duration);
    }

    function updatePlayerUI() {
      const track = getCurrentTrack();
      const cov = document.getElementById('playerCover');
      cov.src = track.cover;
      cov.classList.toggle('spin-paused', !state.isPlaying);
      document.getElementById('playerTitle').textContent = track.title;
      document.getElementById('playerArtist').textContent = track.artist;

      const likeBtn = document.getElementById('playerLikeBtn');
      const liked = state.likedIds.has(track.id);
      likeBtn.className = `hidden sm:flex p-1.5 rounded-full transition hover:scale-110 ${liked ? 'text-pink-400' : 'text-slate-400 hover:text-white'}`;
      likeBtn.innerHTML = `<i data-lucide="heart" class="w-4 h-4 ${liked ? 'fill-current' : ''}"></i>`;

      document.getElementById('playPauseBtn').innerHTML = `<i data-lucide="${state.isPlaying ? 'pause' : 'play'}" class="w-4 h-4 fill-current"></i>`;
      document.getElementById('shuffleBtn').className = `hidden sm:inline-flex transition ${state.shuffle ? 'text-cyan-400' : 'text-slate-400 hover:text-white'}`;
      const repBtn = document.getElementById('repeatBtn');
      repBtn.className = `hidden sm:inline-flex transition ${state.repeatMode !== 'off' ? 'text-violet-400' : 'text-slate-400 hover:text-white'}`;
      repBtn.innerHTML = `<i data-lucide="${state.repeatMode === 'one' ? 'repeat-1' : 'repeat'}" class="w-4 h-4"></i>`;

      document.getElementById('toggleLyricsBtn').className = `p-2 rounded-full transition ${state.drawerMode === 'lyrics' ? 'bg-violet-500/30 text-violet-200' : 'text-slate-400 hover:text-white hover:bg-white/10'}`;
      document.getElementById('toggleQueueBtn').className = `p-2 rounded-full transition ${state.drawerMode === 'queue' ? 'bg-cyan-500/30 text-cyan-200' : 'text-slate-400 hover:text-white hover:bg-white/10'}`;
      document.getElementById('toggleVisBtn').className = `hidden md:inline-flex p-2 rounded-full transition ${state.showVisualizer ? 'bg-pink-500/25 text-pink-300' : 'text-slate-400 hover:text-white hover:bg-white/10'}`;

      document.getElementById('muteBtn').innerHTML = `<i data-lucide="${state.isMuted || state.volume === 0 ? 'volume-x' : 'volume-2'}" class="w-4 h-4"></i>`;

      // Sidebar synth status
      const dot = document.getElementById('synthStatusDot');
      dot.className = `w-2 h-2 rounded-full ${state.isPlaying ? 'bg-cyan-400 shadow-[0_0_10px_#06B6D4] animate-pulse' : 'bg-slate-500'}`;
      document.getElementById('synthStatusLabel').textContent = state.isPlaying ? 'Web Audio Synth Live' : 'Synth Standby';
      document.getElementById('synthBpmBadge').textContent = `${state.mixer.tempo} BPM`;

      updateProgressBarOnly();
      if (window.lucide) window.lucide.createIcons();
    }

    function renderModalPickers() {
      const mWrap = document.getElementById('modalMoodPicker');
      mWrap.innerHTML = ['Chill', 'Hyperfocus', 'Late Night', 'Workout'].map((m) => `
        <button type="button" data-m-mood="${m}" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
          state.modalMood === m ? 'bg-violet-500/35 border-violet-400 text-white' : 'bg-white/5 border-white/10 text-slate-400 hover:text-white'
        }">${m}</button>
      `).join('');
      mWrap.querySelectorAll('[data-m-mood]').forEach((b) => {
        b.addEventListener('click', () => { state.modalMood = b.dataset.mMood; renderModalPickers(); });
      });

      const tWrap = document.getElementById('modalTrackPicker');
      tWrap.innerHTML = TRACKS.map((t) => {
        const chk = state.modalSelectedTracks.has(t.id);
        return `
          <button type="button" data-m-trk="${t.id}" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs border transition ${
            chk ? 'bg-cyan-500/20 border-cyan-400/40 text-white' : 'bg-white/[0.03] border-white/5 text-slate-400 hover:text-white'
          }">
            <span class="truncate">${esc(t.title)} — ${esc(t.artist)}</span>
            <i data-lucide="${chk ? 'check-circle-2' : 'circle'}" class="w-3.5 h-3.5 shrink-0"></i>
          </button>
        `;
      }).join('');
      tWrap.querySelectorAll('[data-m-trk]').forEach((b) => {
        b.addEventListener('click', () => {
          const id = b.dataset.mTrk;
          if (state.modalSelectedTracks.has(id)) state.modalSelectedTracks.delete(id);
          else state.modalSelectedTracks.add(id);
          renderModalPickers();
        });
      });
      if (window.lucide) window.lucide.createIcons();
    }

    function renderAll() {
      document.getElementById('appShell').classList.toggle('ag-zero-g', state.antigravityMode);
      const agBtn = document.getElementById('antigravityToggleBtn');
      const agTrack = document.getElementById('agSwitchTrack');
      const resetBtn = document.getElementById('resetGravityBtn');
      if (state.antigravityMode) {
        agBtn.className = 'flex items-center gap-2 px-3.5 py-2 rounded-2xl text-xs font-semibold border transition-all bg-gradient-to-r from-cyan-500/25 to-violet-500/25 border-cyan-400/60 text-cyan-200 shadow-[0_0_22px_rgba(6,182,212,0.35)]';
        agTrack.className = 'w-8 h-4 rounded-full p-0.5 flex items-center bg-cyan-400 justify-end transition-colors';
        resetBtn.classList.remove('hidden');
      } else {
        agBtn.className = 'flex items-center gap-2 px-3.5 py-2 rounded-2xl text-xs font-semibold border transition-all bg-white/5 border-white/10 text-slate-300 hover:bg-white/10';
        agTrack.className = 'w-8 h-4 rounded-full p-0.5 flex items-center bg-white/15 justify-start transition-colors';
        resetBtn.classList.add('hidden');
      }

      renderSidebar();
      renderDashboard();
      renderDrawer();
      updatePlayerUI();
    }

    // =========================================================================
    // 10. WIRE STATIC CONTROLS & BOOTSTRAP
    // =========================================================================
    document.getElementById('logoBtn').addEventListener('click', () => {
      state.activeNav = 'Home';
      state.selectedArtistId = null;
      state.selectedMood = 'All';
      renderAll();
    });

    // Global Search + Cmd+K shortcut
    const searchInput = document.getElementById('globalSearch');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const shortcutBadge = document.getElementById('searchShortcutBadge');
    searchInput.addEventListener('input', (e) => {
      state.searchQuery = e.target.value;
      clearSearchBtn.classList.toggle('hidden', !state.searchQuery);
      shortcutBadge.classList.toggle('hidden', Boolean(state.searchQuery));
      renderDashboard();
    });
    clearSearchBtn.addEventListener('click', () => {
      state.searchQuery = '';
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      shortcutBadge.classList.remove('hidden');
      renderDashboard();
    });
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape') {
        document.getElementById('createPlaylistModal').classList.add('hidden');
        document.getElementById('notifPopover').classList.add('hidden');
      }
    });

    // Antigravity Mode & Reset Gravity
    document.getElementById('antigravityToggleBtn').addEventListener('click', () => {
      state.antigravityMode = !state.antigravityMode;
      if (!state.antigravityMode) state.cardOffsets = {};
      showToast(state.antigravityMode ? 'Zero-Gravity ON — Drag any album or playlist card freely!' : 'Standard Gravity restored');
      renderAll();
    });
    document.getElementById('resetGravityBtn').addEventListener('click', resetGravity);

    // Notifications Popover
    document.getElementById('profileBtn').addEventListener('click', () => {
      document.getElementById('notifPopover').classList.toggle('hidden');
    });
    document.getElementById('closeNotifBtn').addEventListener('click', () => {
      document.getElementById('notifPopover').classList.add('hidden');
    });

    // Mobile Menu
    document.getElementById('mobileMenuBtn').addEventListener('click', () => document.getElementById('mobileDrawer').classList.remove('hidden'));
    document.getElementById('mobileDrawerClose').addEventListener('click', () => document.getElementById('mobileDrawer').classList.add('hidden'));
    document.getElementById('mobileDrawerBackdrop').addEventListener('click', () => document.getElementById('mobileDrawer').classList.add('hidden'));

    // Create Playlist Modal
    const openCreateModal = () => {
      document.getElementById('createPlaylistModal').classList.remove('hidden');
      renderModalPickers();
    };
    document.getElementById('sidebarCreatePlBtn').addEventListener('click', openCreateModal);
    document.getElementById('sidebarNewPlMini').addEventListener('click', openCreateModal);
    document.getElementById('mobileCreatePlBtn').addEventListener('click', () => {
      document.getElementById('mobileDrawer').classList.add('hidden');
      openCreateModal();
    });
    const closeCreateModal = () => document.getElementById('createPlaylistModal').classList.add('hidden');
    document.getElementById('closeModalBtn').addEventListener('click', closeCreateModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeCreateModal);
    document.getElementById('modalBackdrop').addEventListener('click', closeCreateModal);
    document.getElementById('createPlaylistForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('newPlNameInput').value.trim();
      if (!name) return;
      const trackIds = Array.from(state.modalSelectedTracks);
      const chosen = trackIds.length ? trackIds : ['trk-1', 'trk-4'];
      const covers = chosen.slice(0, 3).map((id) => TRACKS.find((t) => t.id === id)?.cover || ART.hero);
      state.playlists.unshift({
        id: `pl-${Date.now()}`,
        name,
        mood: state.modalMood,
        description: `Custom ${state.modalMood} mix launched from Zero-G Studio.`,
        covers,
        trackIds: chosen,
      });
      document.getElementById('newPlNameInput').value = '';
      closeCreateModal();
      showToast(`Playlist "${name}" launched into orbit`);
      renderAll();
    });

    // Bottom Player Controls
    document.getElementById('playPauseBtn').addEventListener('click', togglePlayPause);
    document.getElementById('nextBtn').addEventListener('click', nextTrack);
    document.getElementById('prevBtn').addEventListener('click', prevTrack);
    document.getElementById('shuffleBtn').addEventListener('click', () => { state.shuffle = !state.shuffle; updatePlayerUI(); });
    document.getElementById('repeatBtn').addEventListener('click', () => {
      state.repeatMode = state.repeatMode === 'off' ? 'all' : state.repeatMode === 'all' ? 'one' : 'off';
      updatePlayerUI();
    });
    document.getElementById('playerLikeBtn').addEventListener('click', () => {
      if (state.likedIds.has(state.currentTrackId)) state.likedIds.delete(state.currentTrackId);
      else state.likedIds.add(state.currentTrackId);
      updatePlayerUI();
      renderDashboard();
    });
    document.getElementById('seekSlider').addEventListener('input', (e) => {
      state.currentTime = Number(e.target.value);
      updateProgressBarOnly();
      if (state.drawerMode === 'lyrics') renderDrawer();
    });
    document.getElementById('toggleLyricsBtn').addEventListener('click', () => {
      state.drawerMode = state.drawerMode === 'lyrics' ? null : 'lyrics';
      renderDrawer();
      updatePlayerUI();
    });
    document.getElementById('toggleQueueBtn').addEventListener('click', () => {
      state.drawerMode = state.drawerMode === 'queue' ? null : 'queue';
      renderDrawer();
      updatePlayerUI();
    });
    document.getElementById('tabLyricsBtn').addEventListener('click', () => { state.drawerMode = 'lyrics'; renderDrawer(); updatePlayerUI(); });
    document.getElementById('tabQueueBtn').addEventListener('click', () => { state.drawerMode = 'queue'; renderDrawer(); updatePlayerUI(); });
    document.getElementById('closeDrawerBtn').addEventListener('click', () => { state.drawerMode = null; renderDrawer(); updatePlayerUI(); });
    document.getElementById('toggleVisBtn').addEventListener('click', () => { state.showVisualizer = !state.showVisualizer; updatePlayerUI(); });
    document.getElementById('muteBtn').addEventListener('click', () => {
      state.isMuted = !state.isMuted;
      synth.updateVolume();
      updatePlayerUI();
    });
    document.getElementById('volumeSlider').addEventListener('input', (e) => {
      state.volume = Number(e.target.value);
      state.isMuted = false;
      synth.updateVolume();
      updatePlayerUI();
    });

    // Boot
    initVisualizer();
    renderAll();
  </script>
</body>
</html>
